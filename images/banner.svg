<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="麦门告解室 McDonald's Confessional">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#f7e7c0"/>
      <rect width="8" height="16" fill="#f2dcae"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#2a2119"/>
      <circle cx="5" cy="5" r="1.2" fill="#3a2f24"/>
    </pattern>
  </defs>

  <!-- 外框：粗黑边 -->
  <rect x="0" y="0" width="1200" height="330" fill="#1a1a1a"/>
  <rect x="6" y="6" width="1188" height="318" fill="#d9232e"/>

  <!-- 顶部警示条 -->
  <g>
    <rect x="6" y="6" width="1188" height="34" fill="#f7c948"/>
    <g fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3">
      <text x="24" y="29">■ 麦当劳程序员创意开发大赛 · 参赛作品</text>
      <text x="1166" y="29" text-anchor="end">非官方产品 · 不碰支付与下单</text>
    </g>
  </g>

  <!-- 主标题区 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="56" y="128" font-size="74" font-weight="900" letter-spacing="8"
          fill="#1a1a1a" opacity="0.55">麦门告解室</text>
    <text x="50" y="122" font-size="74" font-weight="900" letter-spacing="8" fill="#fff8e7">麦门告解室</text>
    <text x="52" y="164" font-size="20" letter-spacing="5" fill="#ffe9a8" font-weight="700">McDonald&#39;s Confessional</text>

    <rect x="50" y="186" width="470" height="34" fill="#1a1a1a"/>
    <text x="62" y="209" font-size="16" letter-spacing="1" fill="#f7c948" font-family="Consolas, monospace" font-weight="700">感情归你，数字归我。 —— 审计官</text>

    <text x="52" y="258" font-size="15" fill="#ffd9dc" letter-spacing="0.8">逐单核价 → 归因亏损 → 四人开庭 → 赎罪打卡</text>
    <text x="52" y="284" font-size="13" fill="#ffb3b8" letter-spacing="0.6" font-family="Consolas, monospace">MCP 取数 · Python 算术 · Agent 表达 · 零第三方依赖</text>
  </g>

  <!-- 右侧：像素天平 -->
  <g transform="translate(880,78)">
    <rect x="-16" y="-16" width="270" height="200" fill="url(#dots)" stroke="#1a1a1a" stroke-width="4"/>
    <g fill="#f7c948" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="miter">
      <!-- 立柱 -->
      <rect x="112" y="26" width="14" height="112"/>
      <rect x="66" y="138" width="106" height="12"/>
      <rect x="84" y="152" width="70" height="10"/>
      <!-- 横梁 -->
      <rect x="30" y="30" width="178" height="12"/>
      <!-- 顶饰 -->
      <rect x="110" y="10" width="18" height="18"/>
      <!-- 左盘链 -->
      <rect x="36" y="42" width="9" height="34"/>
      <rect x="48" y="52" width="9" height="34"/>
      <!-- 左盘 -->
      <rect x="12" y="88" width="76" height="14"/>
      <rect x="20" y="102" width="60" height="10"/>
      <!-- 右盘链 -->
      <rect x="194" y="42" width="9" height="34"/>
      <rect x="206" y="52" width="9" height="34"/>
      <!-- 右盘 -->
      <rect x="170" y="88" width="76" height="14"/>
      <rect x="178" y="102" width="60" height="10"/>
    </g>
    <!-- 左盘上的巨无霸 -->
    <g fill="#e8a33d" stroke="#1a1a1a" stroke-width="3">
      <rect x="26" y="66" width="48" height="8"/>
      <rect x="24" y="74" width="52" height="7" fill="#8f5a2a"/>
      <rect x="26" y="81" width="48" height="7" fill="#5fa050"/>
    </g>
    <!-- 右盘上的优惠券 -->
    <g fill="#fff8e7" stroke="#1a1a1a" stroke-width="3">
      <rect x="184" y="62" width="48" height="26"/>
    </g>
    <text x="208" y="80" font-size="13" font-weight="700" fill="#d9232e" text-anchor="middle"
          font-family="Consolas, monospace">¥</text>
  </g>

  <!-- 底部红黄条 -->
  <rect x="6" y="306" width="1188" height="12" fill="#f7c948"/>
</svg>
